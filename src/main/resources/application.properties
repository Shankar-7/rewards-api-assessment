spring.application.name=rewards-api

# In-memory database, seeded at startup by DemoDataLoader
spring.datasource.url=jdbc:h2:mem:rewardsdb
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.open-in-view=false

# Browse the data at http://localhost:8080/h2-console (JDBC URL: jdbc:h2:mem:rewardsdb, user: sa, no password)
spring.h2.console.enabled=true
